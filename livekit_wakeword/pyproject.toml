[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-livekit-wakeword"
version = "1.2.0"
description = "Wyoming protocol server for livekit-wakeword wake word detection"
readme = "DOCS.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "wyoming>=1.8,<2",
    "livekit-wakeword>=0.2",
    "numpy>=1.24",
]

[tool.setuptools]
packages = ["wyoming_livekit_wakeword"]

[tool.setuptools.package-data]
wyoming_livekit_wakeword = ["models/*.onnx"]
